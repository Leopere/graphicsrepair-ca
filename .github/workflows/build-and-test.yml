name: Build and test GPU site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64, leopere, local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build and validate the production artifact
        run: python3 build_graphics_site.py --check
      - name: JavaScript syntax check
        run: node --check site/assets/site.js
      - name: Lead payload contract tests
        run: node --test tests/test_lead_payload.js
      - name: Install browser contract runtime
        run: python3 -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Install Chromium for browser contract
        run: python3 -m playwright install --with-deps chromium
      - name: WASM browser contract
        run: python3 tests/test_wasm_browser.py
